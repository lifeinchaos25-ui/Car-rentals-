{% extends "layout.html" %}
{% block content %}

<h1 class="title">Owner Login</h1>

<div class="card">
    <form method="POST">
        <label>Username</label>
        <input name="username">

        <label>Password</label>
        <input name="password" type="password">

        <button type="submit">Login</button>
    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
</div>

{% endblock %}
